<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Game Store</title>
<style>
:root{--t:#0b1b3f;--m:#5b6b92;--a:#1f6bff;--g:rgba(255,255,255,.62);--b:rgba(255,255,255,.95)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;color:var(--t);font:15px system-ui,sans-serif;padding:max(16px,env(safe-area-inset-top)) 16px 40px;background:radial-gradient(circle at 10% 5%,#7fb5ff 0,transparent 42%),radial-gradient(circle at 95% 30%,#b3d4ff 0,transparent 40%),radial-gradient(circle at 20% 95%,#9fd0ff 0,transparent 45%),#f4f8ff;background-attachment:fixed}
#app{max-width:560px;margin:auto}
.card,.row,.tile,input{background:var(--g);border:1px solid var(--b);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);box-shadow:0 8px 28px rgba(31,107,255,.16),inset 0 1px 0 #fff}
.card,.row,.tile{border-radius:18px}
.wallet{padding:20px;margin-bottom:14px;background:linear-gradient(135deg,rgba(31,107,255,.92),rgba(74,168,255,.85));color:#fff;border-color:rgba(255,255,255,.6)}
.wallet small{color:rgba(255,255,255,.88)}.wallet b{display:block;font-size:30px;margin:4px 0}
.tile,.row{padding:17px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.tile span{color:var(--a);font-size:20px}
.row.on{border-color:var(--a);background:rgba(31,107,255,.14)}.m{color:var(--m);font-size:13px}
input{width:100%;padding:14px;border-radius:14px;color:var(--t);font-size:15px;margin-bottom:10px;outline:0}input:focus{border-color:var(--a)}input::placeholder{color:var(--m)}
.btn{width:100%;padding:15px;border:1px solid rgba(255,255,255,.7);border-radius:16px;background:linear-gradient(135deg,#1f6bff,#3fa0ff);box-shadow:0 8px 22px rgba(31,107,255,.35);color:#fff;font-size:16px;font-weight:600;margin-top:8px}
.btn:disabled{opacity:.5}.back{background:none;border:0;color:var(--a);font-size:15px;font-weight:600;padding:6px 0 12px}
.chip{font-size:12px;padding:3px 9px;border-radius:99px;background:var(--g);border:1px solid var(--b)}.COMPLETED{color:#16a34a}.FAILED{color:#dc2626}
h3{margin:14px 0 8px;font-size:14px;color:var(--m)}code{word-break:break-all;color:#0b4fd1;background:rgba(31,107,255,.1);padding:2px 6px;border-radius:6px}
.ti{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:rgba(31,107,255,.14);color:var(--a);flex:none}
.tile b{flex:1;margin-left:12px}.tile>span:last-child{display:flex}
.wh{display:flex;justify-content:space-between;align-items:center}.wh span{display:flex;gap:8px;align-items:center}
.out{background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.55);color:#fff;border-radius:12px;padding:6px 8px;display:flex}
.back{display:flex;align-items:center;gap:2px}.row>span:last-child svg{color:var(--a)}
.sb{position:relative}.sb svg{position:absolute;left:14px;top:14px;color:var(--m)}.sb input{padding-left:44px}
.btn.gbtn{background:#fff;color:#0b1b3f;display:flex;gap:10px;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(31,107,255,.2)}
.gi{width:44px;height:44px;border-radius:12px;object-fit:cover;margin-right:12px;flex:none;background:rgba(31,107,255,.1)}.row>div{flex:1}select{width:100%;padding:14px;border-radius:14px;border:1px solid var(--b);background:var(--g);color:var(--t);font-size:15px;margin-bottom:10px}.Pending,.Processing{color:#d97706}.Success{color:#16a34a}.Fail{color:#dc2626}
</style></head><body><div id="app"></div>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const W='https://YOUR-MINI-WORKER.workers.dev',OWNER='linngamestore@gmail.com';
const CFG={apiKey:"AIzaSyC9soIo8J-NP5bc4STi_eOB1oP94IvcOL8",authDomain:"linngametopupstore.firebaseapp.com",projectId:"linngametopupstore",storageBucket:"linngametopupstore.firebasestorage.app",messagingSenderId:"1081466939722",appId:"1:1081466939722:web:affbccdedc64a28ca439b3"};
const $=s=>document.querySelector(s),app=$('#app');let db,unsub=[];
const err=e=>{const d=document.createElement('div');d.style.cssText='position:fixed;left:12px;right:12px;bottom:12px;padding:12px;border-radius:14px;background:rgba(254,226,226,.9);color:#991b1b;border:1px solid #fff;font-size:13px;z-index:9';d.textContent='Error: '+(e&&e.message||e);document.body.appendChild(d);setTimeout(()=>d.remove(),8000)};
let S={rate:4500,games:[],bal:null,orders:[],gid:null,view:'login',kind:'game',q:'',g:null,pk:null,busy:0,err:''};
const usd=m=>'$'+(m/S.rate).toFixed(2),mmk=m=>Math.round(m).toLocaleString()+' MMK';
const go=(v,x={})=>{Object.assign(S,{view:v},x);draw()};
const gift=S0=>S.kind=='gift';
const list=()=>{const q=S.q.toLowerCase();return S.games.filter(g=>(S.kind=='gift'?g.fulfillProvider==='g2bulk_voucher':!!g.g2bulkCode&&g.fulfillProvider!=='g2bulk_voucher')&&(g.name||'').toLowerCase().includes(q)).sort((a,b)=>a.name.localeCompare(b.name))};
const pkgs=g=>(g.packages||[]).map((p,i)=>({...p,i})).filter(p=>S.kind=='gift'?p.voucherId:p.g2bulk);
function rows(){return list().map(g=>`<div class="row" onclick="go('game',{g:S.games.find(x=>x.id=='${g.id}'),pk:null})"><img class="gi" src="${g.image||''}" alt=""><div><b>${g.name}</b></div><span>${I.chev}</span></div>`).join('')||'<p class="m">No items found.</p>'}
const ic=d=>`<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const I={game:ic('<rect x="2" y="7" width="20" height="11" rx="5"/><path d="M7 10v5M4.5 12.5h5"/><circle cx="16" cy="11.5" r="1"/><circle cx="18.5" cy="14" r="1"/>'),
gift:ic('<rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13M5 12v8a1 1 0 001 1h12a1 1 0 001-1v-8M7.5 8a2.5 2.5 0 110-5C10 3 12 8 12 8s2-5 4.5-5a2.5 2.5 0 110 5"/>'),
list:ic('<path d="M6 3h12a1 1 0 011 1v17l-3-2-2 2-2-2-2 2-2-2-3 2V4a1 1 0 011-1z"/><path d="M9 8h6M9 12h6"/>'),
chev:ic('<path d="M9 6l6 6-6 6"/>'),back:ic('<path d="M15 6l-6 6 6 6"/>'),search:ic('<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>'),
wallet:ic('<path d="M3 7a2 2 0 012-2h13v4"/><path d="M3 7v11a2 2 0 002 2h15a1 1 0 001-1V9a1 1 0 00-1-1H5a2 2 0 01-2-2z"/><circle cx="17" cy="14" r="1.2"/>'),
out:ic('<path d="M15 4h3a2 2 0 012 2v12a2 2 0 01-2 2h-3M10 8l-4 4 4 4M6 12h11"/>'),
g:'<svg width="20" height="20" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4.1 7.1-10.1 7.1-17.5z"/><path fill="#FBBC05" d="M10.5 28.7A14.5 14.5 0 019.5 24c0-1.6.3-3.2.8-4.7l-7.9-6.1A24 24 0 000 24c0 3.9.9 7.5 2.6 10.8l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.8 2.3-8.4 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg>'};
function draw(){const g=S.g,G=S.kind=='gift';
 if(S.view=='login')app.innerHTML=`<div style="min-height:85vh;display:grid;place-items:center"><div class="card" style="padding:28px;text-align:center;width:100%"><div class="ti" style="margin:0 auto 14px;width:56px;height:56px">${I.wallet}</div><h2>Game Store</h2><p class="m" style="margin:8px 0 18px">Sign in to use your wallet</p><button class="btn gbtn" onclick="login()">${I.g} Continue with Google</button><p style="margin-top:12px;color:#dc2626;font-size:13px">${S.err||''}</p></div></div>`;
 if(S.view=='home')app.innerHTML=`<div class="card wallet"><div class="wh"><span>${I.wallet} Wallet Balance</span><button class="out" onclick="logout()">${I.out}</button></div><b>${S.bal==null?'...':usd(S.bal)}</b><small>${S.bal==null?'':mmk(S.bal)}</small></div>
 <div class="tile" onclick="go('list',{kind:'game',q:''})"><span class="ti">${I.game}</span><b>Game Top Up</b><span>${I.chev}</span></div>
 <div class="tile" onclick="go('list',{kind:'gift',q:''})"><span class="ti">${I.gift}</span><b>Gifts Cards And Voucher</b><span>${I.chev}</span></div>
 <div class="tile" onclick="openOrders()"><span class="ti">${I.list}</span><b>Order List</b><span>${I.chev}</span></div>`;
 if(S.view=='list')app.innerHTML=`<button class="back" onclick="go('home')">${I.back}Back</button><div class="sb">${I.search}<input id="q" placeholder="Search..." value="${S.q}" oninput="S.q=this.value;$('#rows').innerHTML=rows()"></div><div id="rows">${rows()}</div>`;
 if(S.view=='game'){const o=(g.g2bulkServerOptions||[]).map(x=>typeof x=='string'?[x,x]:[x.value??x.id??x.name,x.label??x.name??x.value]);
 app.innerHTML=`<button class="back" onclick="go('list')">${I.back}Back</button><h2 style="margin-bottom:10px">${g.name}</h2>
 ${G?'':`<h3>Account</h3><input id="pid" placeholder="Player ID" inputmode="numeric">${o.length?`<select id="sid"><option value="">Select Server</option>${o.map(x=>`<option value="${x[0]}">${x[1]}</option>`).join('')}</select>`:g.serverIdRequired?'<input id="sid" placeholder="Server ID" inputmode="numeric">':''}${g.charNameRequired?'<input id="cn" placeholder="Character Name">':''}`}
 <h3>Select Package</h3>${pkgs(g).map(p=>`<div class="row ${S.pk&&S.pk.i==p.i?'on':''}" onclick="S.pk=pkgs(S.g).find(x=>x.i==${p.i});sel()"><b>${p.amount}</b><span style="text-align:right">${usd(p.price)}<div class="m">${mmk(p.price)}</div></span></div>`).join('')||'<p class="m">No packages.</p>'}
 ${S.pk?`<div class="card" style="padding:14px;margin-top:10px">Total <b>${usd(S.pk.price)}</b> <span class="m">(${mmk(S.pk.price)})</span></div>`:''}
 <button class="btn" ${S.busy?'disabled':''} onclick="confirmOrder()">${S.busy?'Processing...':'Confirm'}</button>`}
 if(S.view=='orders')app.innerHTML=`<button class="back" onclick="go('home')">${I.back}Back</button>`+(S.orders.map(o=>`<div class="card" style="padding:14px;margin-bottom:10px"><div style="display:flex;justify-content:space-between"><b>${o.game}</b><span class="chip ${o.status}">${o.status}</span></div><div class="m">${o.itemAmount} · ${mmk(o.price)}${o.playerId?' · ID '+o.playerId+(o.serverId?' ('+o.serverId+')':''):''}</div>${(o.deliveryItems||[]).map(c=>`<div style="margin-top:6px"><code>${c}</code></div>`).join('')}</div>`).join('')||'<p class="m">No orders yet.</p>')}
function sel(){const p=$('#pid')?.value,s=$('#sid')?.value,c=$('#cn')?.value;draw();if($('#cn'))$('#cn').value=c;if($('#pid'))$('#pid').value=p;if($('#sid'))$('#sid').value=s}
async function confirmOrder(){const g=S.g,pk=S.pk,G=S.kind=='gift';if(!pk)return alert('Select a package');
 const pid=$('#pid')?.value.trim()||'',sid=$('#sid')?.value.trim()||'',cn=$('#cn')?.value.trim()||'';if(!G&&!pid)return alert('Enter Player ID');if(!G&&$('#sid')&&!sid)return alert('Enter Server ID');if(!G&&g.charNameRequired&&!cn)return alert('Enter Character Name');
 S.busy=1;draw();try{let name='';
  if(!G){const r=await fetch('https://api.g2bulk.com/v1/games/checkPlayerId',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({game:g.g2bulkCode,user_id:pid,server_id:sid})}).then(r=>r.json()).catch(()=>null);
   if(r&&r.valid===false)throw Error('Invalid Player ID');name=r&&r.name||''}
  const r=await api('/order',{kind:S.kind,gameId:g.id,pkgIndex:pk.i,playerId:pid,serverId:sid,inGameName:name,charName:cn,key:crypto.randomUUID()});if(!r.ok)throw Error(r.error||'Order failed');loadBal();
  S.busy=0;openOrders()}catch(e){S.busy=0;draw();alert(e.message)}}
const login=async()=>{S.err='';const p=new firebase.auth.GoogleAuthProvider();p.setCustomParameters({login_hint:OWNER});
 try{await firebase.auth().signInWithPopup(p)}catch(e){if(/popup/.test(e.code))firebase.auth().signInWithRedirect(p);else{S.err=e.message;draw()}}};
const logout=()=>firebase.auth().signOut();
const api=async(p,b)=>{const t=await firebase.auth().currentUser.getIdToken();const r=await fetch(W+p,{method:b?'POST':'GET',headers:{Authorization:'Bearer '+t,...(b?{'Content-Type':'application/json'}:{})},body:b?JSON.stringify(b):undefined});return r.json()};
async function loadBal(){try{const r=await api('/balance');if(r.ok){S.rate=r.rate;S.bal=r.mmk}else err(r.error)}catch(e){err(e)}if(S.view=='home'||S.view=='game')draw()}
async function loadOrders(){try{const r=await api('/orders');if(r.ok){S.orders=r.orders;if(S.view=='orders')draw()}}catch(e){}}
function openOrders(){go('orders');loadOrders();clearInterval(S.t);S.t=setInterval(()=>S.view=='orders'?loadOrders():clearInterval(S.t),6000)}
function start(u){unsub=[db.collection('games').onSnapshot(s=>{S.games=s.docs.map(d=>({id:d.id,...d.data()}));if(S.view=='list')$('#rows').innerHTML=rows()},err)];loadBal();setInterval(()=>S.view=='home'&&loadBal(),60000);go('home')}
try{window.Telegram?.WebApp?.ready();window.Telegram?.WebApp?.expand()}catch(e){}
draw();
try{firebase.initializeApp(CFG);db=firebase.firestore();
 firebase.auth().onAuthStateChanged(u=>{unsub.forEach(f=>f());unsub=[];
  if(!u){S.gid=null;S.bal=null;return go('login')}
  if((u.email||'').toLowerCase()!==OWNER){S.err='This account is not allowed.';firebase.auth().signOut();return}
  start(u)})}catch(e){err(e)}
</script></body></html>
